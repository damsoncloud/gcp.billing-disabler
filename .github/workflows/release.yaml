name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the semantic version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: damsoncloud/dcp.sdlc/.github/workflows/container-image-release.yaml@main
    with:
      bump: ${{ inputs.bump }}
