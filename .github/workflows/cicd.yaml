name: CI/CD pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  container-image:
    uses: damsoncloud/dcp.sdlc/.github/workflows/container-image-ci.yaml@v1.1.0

  ci:
    if: always()
    needs: container-image
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.container-image.result }}" = success
