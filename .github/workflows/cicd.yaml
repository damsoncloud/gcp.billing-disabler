  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - uses: damsoncloud/dcp.sdlc/.github/actions/initialise_devenv@main
        with:
          github_access_token: ${{ github.token }}
